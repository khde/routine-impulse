# General
quarkus.application.name=Routine Impulse
quarkus.log.level=INFO
quarkus.http.port=8080
# Banner
quarkus.banner.enabled=true
quarkus.banner.path=banner.txt

# Database
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USERNAME}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# Security
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.issuer=routine-impulse
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token
smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}

quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

quarkus.http.auth.permission.auth.paths=/api/auth/*
quarkus.http.auth.permission.auth.policy=permit
quarkus.http.auth.proactive=false
